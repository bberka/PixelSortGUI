name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec xo

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsgo -b

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test run

  hooks:
    name: Commit-msg hook test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh .hooks/test-commit-msg.sh

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check PR commit messages for attribution lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$sha" > "$tmp"
            if ! sh .hooks/commit-msg "$tmp"; then
              echo "::error::Commit $sha failed the commit-msg check."
              failed=1
            fi
          done
          exit "$failed"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run build

  # End-to-end (Playwright) job: added in T0.4 and wired into `test.needs` below.

  test:
    name: test
    needs: [lint, typecheck, unit, hooks, commit-messages, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all required jobs succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          HOOKS_RESULT: ${{ needs.hooks.result }}
          COMMIT_MESSAGES_RESULT: ${{ needs.commit-messages.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=0
          for pair in \
            "lint:$LINT_RESULT" \
            "typecheck:$TYPECHECK_RESULT" \
            "unit:$UNIT_RESULT" \
            "hooks:$HOOKS_RESULT" \
            "build:$BUILD_RESULT"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::Required job '$job' did not succeed (result: $result)."
              failed=1
            fi
          done

          echo "commit-messages: $COMMIT_MESSAGES_RESULT (event: $EVENT_NAME)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$COMMIT_MESSAGES_RESULT" != "success" ]; then
              echo "::error::Required job 'commit-messages' did not succeed on pull_request (result: $COMMIT_MESSAGES_RESULT)."
              failed=1
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$COMMIT_MESSAGES_RESULT" != "success" ] && [ "$COMMIT_MESSAGES_RESULT" != "skipped" ]; then
              echo "::error::Job 'commit-messages' had unexpected result on push: $COMMIT_MESSAGES_RESULT."
              failed=1
            fi
          else
            if [ "$COMMIT_MESSAGES_RESULT" != "success" ]; then
              echo "::error::Job 'commit-messages' did not succeed on $EVENT_NAME (result: $COMMIT_MESSAGES_RESULT)."
              failed=1
            fi
          fi

          exit "$failed"
