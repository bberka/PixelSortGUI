<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Drift</title>
		<script>
			try {
				var t = localStorage.getItem('drift:theme');
				document.documentElement.dataset.theme =
					t === 'light' || t === 'dark' || t === 'system' ? t : 'system';
			} catch {
				document.documentElement.dataset.theme = 'system';
			}
		</script>
		<meta
			content="Offline web editor for glitch art and pixel sorting of still photos."
			name="description"
		/>
		<link type="image/svg+xml" href="/icons/icon.svg" rel="icon" />
		<link href="/icons/apple-touch-icon.png" rel="apple-touch-icon" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
